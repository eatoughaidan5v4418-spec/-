<text x="1010" y="1610" fill="#7254ad" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" >转台检测 5 芯 + 1 备用</text>
<text x="85" y="1650" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >电机线与检测线分束；具体线径、分隔、接头与弯曲半径按实物确认。</text>
