<text x="1567" y="570" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >上方有托盘；出线口及护边位置待复核。</text>
<circle cx="1545" cy="631" r="8" fill="#d99422" stroke="none" stroke-width="2" />
<text x="1567" y="640" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start" >环形导槽 / 盖板</text>
<text x="1567" y="680" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >优先研究 R≈60～90 的轴承外围区域。</text>
<text x="1567" y="715" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >局部超出转运板投影，需独立支承和防护。</text>
<circle cx="1545" cy="776" r="8" fill="#7254ad" stroke="none" stroke-width="2" />
<text x="1567" y="785" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start" >旋转设定</text>
<text x="1567" y="825" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >保持 −135°～+180° 往返，不连续转圈。</text>
<text x="1567" y="860" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >在中间角 +22.5° 调整初始预留，再测两端。</text>
<rect x="1530" y="895" width="765" height="245" rx="14" fill="#fff7e7" stroke="#efd59e" stroke-width="2" />
<text x="1558" y="936" fill="#76541d" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >现有高度很紧：</text>
<text x="1558" y="975" fill="#76541d" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >一层对接时，升降盘顶 Z=78，P03E 底 Z=86。</text>
<text x="1558" y="1014" fill="#76541d" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >两者标高差仅 8 mm，不能当成已测净空。</text>
<text x="1558" y="1053" fill="#76541d" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >线径、护罩、螺钉与运动包络必须一起试配。</text>
<text x="1558" y="1092" fill="#76541d" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >中心轴、法兰和轴承位置不能直接穿线。</text>
<circle cx="1545" cy="1226" r="8" fill="#7254ad" stroke="none" stroke-width="2" />
<text x="1567" y="1235" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start" >旋转侧出线</text>
<text x="1567" y="1275" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >分别去 U 电机、拨叉两端开关、托盘霍尔。</text>
<text x="1567" y="1310" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >沿板下固定，过板后避开皮带、滑块和托盘。</text>
<text x="1545" y="1410" fill="#c75146" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" >若 8 mm 内无法实现，应调整轴系叠层或改用合适旋转接头。</text>
<text x="1545" y="1445" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" >任何高度改动都要重核托盘对接及 8 mm 啮合。</text>
<rect x="55" y="1565" width="2290" height="110" rx="14" fill="#dfebf0" stroke="none" stroke-width="1" />
<text x="85" y="1610" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" text-anchor="start" >去向</text>
<text x="205" y="1610" fill="#087f8c" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" >θ 电机 / θ 霍尔：到升降平台为止</text>
<text x="1065" y="1610" fill="#7254ad" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" >U 电机 / 限位 / 托盘霍尔：经过旋转线环</text>
<text x="85" y="1650" fill="#5d7283" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >JF、JR 位置、线环的弯曲、层间隔离和穿板孔均为试配方案；不得直接按图加工。</text>
</svg>