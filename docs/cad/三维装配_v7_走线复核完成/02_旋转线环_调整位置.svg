<text x="2140" y="570" fill="white" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle" >4</text>
<rect x="1720" y="634" width="54" height="72" rx="0" fill="#cc413b" stroke="#cc413b" stroke-width="2" />
<circle cx="1675" cy="632.0" r="23" fill="#cc413b" stroke="white" stroke-width="3" />
<text x="1675" y="640.0" fill="white" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle" >3</text>
<line x1="2195" y1="922" x2="2195" y2="634" stroke="#5c7182" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="2208" y="778" fill="#5c7182" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" >8</text>
<text x="1290" y="1390" fill="#cc413b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" >4  JR 候选线夹与 P03E 实体相交：基准姿态重叠体积 192 mm³。</text>
<text x="1290" y="1430" fill="#5c7182" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >    需重新设计线夹位置、开孔和护边；导槽高度与紧固件一起调整。</text>
<text x="1290" y="1470" fill="#5c7182" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >    8 mm 是部件标高差，不是已验证的可用走线净高。</text>
<rect x="55" y="1560" width="2290" height="112" rx="14" fill="#e6eff2" stroke="none" stroke-width="1" />
<text x="85" y="1605" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" text-anchor="start" >调整方向</text>
<text x="235" y="1605" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" text-anchor="start" >避开紧固件并重做导槽和线夹，或重新设计转台叠层；最终再用真实线材验证往返收放。</text>
<text x="85" y="1645" fill="#5c7182" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >线径、可弯半径、盖板、分隔、入口出口及应力释放尚未确定；不得直接按本图加工。</text>
</svg>