<text x="1540" y="607" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" >P03E 转运板</text>
<rect x="1990" y="526" width="105" height="252" rx="0" fill="#d1b3e2" stroke="#7254ad" stroke-width="3" />
<rect x="1990" y="526" width="105" height="108" rx="0" fill="#e65c52" stroke="#cc413b" stroke-width="3" />
