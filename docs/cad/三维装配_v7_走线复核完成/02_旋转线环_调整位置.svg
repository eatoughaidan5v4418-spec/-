<text x="68" y="126" fill="#5c7182" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" >基准姿态 ZL=100、θ=0 · 黄色环为候选占用区，不代表真实柔性电缆形状</text>
