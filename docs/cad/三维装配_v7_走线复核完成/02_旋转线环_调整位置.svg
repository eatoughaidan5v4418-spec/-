<text x="980.0" y="828.0" fill="white" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="middle" >4</text>
<text x="130" y="375" fill="#9b6b1c" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" >黄色：R62～88 占用区</text>
<text x="130" y="410" fill="#cc413b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" >红点：与占用区相交的螺钉 / 螺母</text>
<text x="130" y="445" fill="#568194" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" >淡蓝：P03E 转运板</text>
<text x="100" y="1430" fill="#cc413b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" >3  螺钉头、限位座紧固件和惰轮螺母进入线环候选占用区。</text>
<text x="100" y="1466" fill="#5c7182" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" >     这是空间重叠；并不表示已模拟真实线缆轨迹。</text>
<text x="100" y="1502" fill="#cc413b" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" >5  JF 固定夹在 −135° 等姿态碰到转运板；−135° 还碰安装螺钉。</text>
<text x="1275" y="230" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" text-anchor="start" >② 侧向关系：高度与旋转侧线夹</text>
<text x="1275" y="270" fill="#5c7182" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >局部示意，不同部件投影到同一剖面以便阅读</text>
<rect x="1320" y="922" width="345" height="180" rx="0" fill="#b8c8d1" stroke="#839ba9" stroke-width="2" />
<text x="1352" y="1040" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" text-anchor="start" >升降盘</text>
<rect x="1605" y="886" width="500" height="72" rx="0" fill="#e5c273" stroke="#b17b28" stroke-width="2" />
<text x="1630" y="930" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" text-anchor="start" >候选导槽底座</text>
<rect x="1700" y="670" width="330" height="180" rx="0" fill="#ffe4a8" stroke="#d49d36" stroke-width="2" />
<text x="1723" y="788" fill="#8e6118" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" >线环占用区</text>
