<text x="95" y="1490" fill="#087f8c" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" >已对模型中 13 个停放托盘的甲板支承投影复算：修改前后面积相同；不代表强度已通过。</text>
<text x="95" y="1530" fill="#5b7181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >修改后通道为 r100～174、切向 ±13；实际开口须按所选拖链和端头复核。</text>
