<text x="95" y="1387" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" >J1 升降侧：支架与旋转线环导槽一体；升降盘同步增加 2 个 Ø2.2 试配孔。</text>
