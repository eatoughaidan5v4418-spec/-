<text x="1295" y="1320" fill="#c94c43" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" text-anchor="start" >移动托盘与两段拖链均发生相交。</text>
<text x="1295" y="1360" fill="#c94c43" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" text-anchor="start" >Z=100、θ=67.5°：U=34.5 即检测到相交。</text>
<rect x="55" y="1460" width="2290" height="220" rx="14" fill="#fff2ee" stroke="#edd0c9" stroke-width="2" />
<text x="90" y="1510" fill="#c94c43" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" text-anchor="start" >动作条件必须落实</text>
<text x="90" y="1555" fill="#17334a" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="400" text-anchor="start" >旋转前确认拨叉已收回；推拉前确认转盘已停止并对准有效车位。</text>
<text x="90" y="1595" fill="#5b7181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" text-anchor="start" >项目网页仅为演示，实际控制和检测须实现并验证互锁；啮合 / 脱开按机构工序受控执行。</text>
<text x="90" y="1637" fill="#5b7181" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" text-anchor="start" >正常车位角度的推拉与收回状态下的旋转已做保守连续净空计算；其他组合不能视为安全。</text>
