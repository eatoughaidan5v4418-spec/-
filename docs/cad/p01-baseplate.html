<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <title>P01 底板 · Three.js</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1115; color: #e8eaed; font-family: system-ui, sans-serif; }
    #ui { position: absolute; left: 12px; top: 12px; z-index: 2; background: rgba(20,22,28,.88); padding: 12px 14px; border-radius: 10px; max-width: 320px; line-height: 1.45; font-size: 13px; }
    #ui h1 { margin: 0 0 6px; font-size: 15px; }
    #ui code { color: #8ab4f8; }
    #hint { position: absolute; right: 12px; bottom: 12px; z-index: 2; opacity: .7; font-size: 12px; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>P01 底板（精确 mm）</h1>
    <div>外形 <code>300 × 180 × 5</code></div>
    <div>电机轴心 <code>(150, 40)</code> · 孔距 31×31</div>
    <div>光轴 <code>(95,40)</code> / <code>(205,40)</code> · 跨距 110</div>
    <div>电子净空 <code>X50–250, Y75–175</code></div>
    <div style="margin-top:8px;opacity:.8">拖拽旋转 · 滚轮缩放 · 右键平移</div>
  </div>
  <div id="hint">单位 mm · Y-up 已映射为板面法向</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Plate in XY, thickness Z; origin at left-front-bottom corner matching CAD doc
    const W = 300, D = 180, T = 5;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1115);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 5000);
    camera.position.set(220, 280, 320);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(W / 2, T / 2, D / 2);
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const dir = new THREE.DirectionalLight(0xffffff, 0.85);
    dir.position.set(200, 400, 100);
    scene.add(dir);

    // Helper: CAD (x,y) on plate top → Three (x, T, y)
    function cad(x, y, z = T) {
      return new THREE.Vector3(x, z, y);
    }

    // Plate body
    const plateMat = new THREE.MeshStandardMaterial({ color: 0x3a7bd5, metalness: 0.15, roughness: 0.55 });
    const plate = new THREE.Mesh(new THREE.BoxGeometry(W, T, D), plateMat);
    plate.position.set(W / 2, T / 2, D / 2);
    scene.add(plate);

    // Edge lines
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(W, T, D)),
      new THREE.LineBasicMaterial({ color: 0xffffff })
    );
    edges.position.copy(plate.position);
    scene.add(edges);

    // Electronics keep-out (dashed box on top surface)
    const kx0 = 50, kx1 = 250, ky0 = 75, ky1 = 175, kh = 40;
    const keepGeo = new THREE.BoxGeometry(kx1 - kx0, kh, ky1 - ky0);
    const keep = new THREE.Mesh(
      keepGeo,
      new THREE.MeshStandardMaterial({ color: 0xf4c20d, transparent: true, opacity: 0.22 })
    );
    keep.position.set((kx0 + kx1) / 2, T + kh / 2, (ky0 + ky1) / 2);
    scene.add(keep);
    const keepEdge = new THREE.LineSegments(
      new THREE.EdgesGeometry(keepGeo),
      new THREE.LineBasicMaterial({ color: 0xf4c20d })
    );
    keepEdge.position.copy(keep.position);
    scene.add(keepEdge);

    function addHoleMarker(x, y, color, labelY = 12) {
      const g = new THREE.Group();
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(2.2, 3.2, 24),
        new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.copy(cad(x, y, T + 0.2));
      g.add(ring);
      const pin = new THREE.Mesh(
        new THREE.CylinderGeometry(0.8, 0.8, 8, 12),
        new THREE.MeshBasicMaterial({ color })
      );
      pin.position.copy(cad(x, y, T + 4));
      g.add(pin);
      scene.add(g);
      return g;
    }

    // Motor center + 31x31 holes
    const mx = 150, my = 40;
    addHoleMarker(mx, my, 0xff6b6b);
    const half = 15.5;
    [[-half, -half], [half, -half], [-half, half], [half, half]].forEach(([dx, dy]) => {
      addHoleMarker(mx + dx, my + dy, 0xff9f9f);
    });

    // Light shafts
    addHoleMarker(95, 40, 0x69f0ae);
    addHoleMarker(205, 40, 0x69f0ae);

    // Span line between shafts
    const span = new THREE.BufferGeometry().setFromPoints([
      cad(95, 40, T + 0.5),
      cad(205, 40, T + 0.5),
    ]);
    scene.add(new THREE.Line(span, new THREE.LineBasicMaterial({ color: 0x69f0ae })));

    // Axes at origin
    scene.add(new THREE.AxesHelper(40));

    // Grid under plate
    const grid = new THREE.GridHelper(400, 40, 0x444444, 0x2a2a2a);
    grid.position.set(W / 2, -0.05, D / 2);
    scene.add(grid);

    // Dimension labels as sprites
    function makeLabel(text, pos) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.clearRect(0, 0, 512, 128);
      ctx.font = 'bold 48px system-ui,sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 6;
      ctx.strokeText(text, 16, 72);
      ctx.fillText(text, 16, 72);
      const tex = new THREE.CanvasTexture(c);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const spr = new THREE.Sprite(mat);
      spr.scale.set(60, 15, 1);
      spr.position.copy(pos);
      scene.add(spr);
    }
    makeLabel('300', cad(150, -12, T + 2));
    makeLabel('180', cad(-18, 90, T + 2));
    makeLabel('(150,40)', cad(150, 40, T + 18));
    makeLabel('110', cad(150, 40, T + 8));

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    (function loop() {
      requestAnimationFrame(loop);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
