<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #233043; }
      .title { font-size: 28px; font-weight: 700; } .sub { font-size: 16px; fill: #536377; }
      .heading { font-size: 22px; font-weight: 700; } .label { font-size: 17px; }
      .small { font-size: 14px; fill: #536377; } .red { fill: #ad2537; font-weight: 700; }
      .outline { stroke: #8294aa; stroke-width: 1; } .grid { stroke: #d9e1ea; stroke-dasharray: 4 5; }
    </style>
  </defs>
  <rect width="1440" height="750" fill="#f4f7fa"/>
  <text class="title" x="48" y="53">两台 67 mm 长轴：当前装配位置下的轴向检查</text>
  <text class="sub" x="48" y="83">这是尺寸关系示意；Z = 0 为底板上表面。电机安装位置和部分零件外形仍为假设，不能用于下料。</text>
  <rect x="36" y="110" width="670" height="600" rx="16" fill="#fff" class="outline"/>
  <rect x="734" y="110" width="670" height="600" rx="16" fill="#fff" class="outline"/>
  <text class="heading" x="62" y="151">① 升降电机与丝杆</text>
  <text class="sub" x="62" y="180">假设电机底面 Z=0、安装面朝上；丝杆从 Z=60 开始。</text>
  <!-- 左图 z 轴刻度采用 2.5 px/mm，仅画到 z=120。 -->
  <g class="grid"><path d="M90 530 H395 M90 430 H395 M90 380 H395 M90 262.5 H395 M90 230 H395"/></g>
  <text class="small" x="80" y="535">Z 0</text><text class="small" x="80" y="435">40</text>
  <text class="small" x="80" y="385">60</text><text class="small" x="80" y="268">107</text>
  <text class="small" x="80" y="235">120</text>
  <rect x="140" y="430" width="70" height="100" rx="4" fill="#9aa8ba" stroke="#617187"/>
  <text class="label" x="142" y="475">电机</text><text class="small" x="142" y="496">机身</text>
  <rect x="233" y="262.5" width="18" height="167.5" fill="#bc4453"/>
  <rect x="302" y="230" width="26" height="150" fill="#c99a39"/>
  <rect x="218" y="262.5" width="125" height="117.5" fill="#e55663" opacity="0.17" stroke="#cb3e4b" stroke-width="2"/>
  <path d="M360 262.5 h13 M367 262.5 v117.5 M360 380 h13" stroke="#b12b3a" stroke-width="2" fill="none"/>
  <text class="red label" x="386" y="315">重叠约 47 mm</text>
  <text class="small" x="386" y="342">Z=60 ～ 107</text>
  <text class="label" x="215" y="216">电机轴</text><text class="label" x="298" y="216">丝杆</text>
  <text class="small" x="300" y="200">向上至 Z=260</text>
  <text class="small" x="111" y="562">为便于看清，图中将本应同轴的电机轴和丝杆并排画出。</text>
  <text class="label red" x="62" y="612">同一段空间被两根轴占用，现有假设无法直接装配。</text>
  <text class="small" x="62" y="645">需要重新确定电机高度、联轴器插入长度与丝杆端部位置。</text>
  <text class="small" x="62" y="671">机身 40 mm 按资料上限建模，实际安装尺寸需复核。</text>
  <text class="heading" x="760" y="151">② 旋转电机与托盘</text>
  <text class="sub" x="760" y="180">一层载盘工况：托盘下表面 Z=100；电机输出面 Z=73。</text>
  <!-- 右图从 Z=30 开始，采用 3 px/mm。 -->
  <g class="grid"><path d="M790 551 H1160 M790 431 H1160 M790 392 H1160 M790 350 H1160 M790 341 H1160 M790 230 H1160"/></g>
  <text class="small" x="780" y="556">Z 33</text><text class="small" x="780" y="436">73</text>
  <text class="small" x="780" y="397">86</text><text class="small" x="780" y="362">100</text>
  <text class="small" x="780" y="340">103</text><text class="small" x="780" y="235">140</text>
  <rect x="850" y="431" width="75" height="120" rx="4" fill="#9aa8ba" stroke="#617187"/>
  <text class="label" x="855" y="482">旋转</text><text class="label" x="855" y="505">电机</text>
  <rect x="942" y="416" width="160" height="15" fill="#7ca3c9" opacity="0.8"/>
  <rect x="942" y="392" width="160" height="24" fill="#a98bc6" opacity="0.7"/>
  <rect x="942" y="383" width="160" height="9" fill="#6ab5b9"/>
  <rect x="989" y="368" width="36" height="15" fill="#8492a2"/>
  <rect x="930" y="341" width="190" height="9" fill="#73b78c"/>
  <rect x="930" y="251" width="190" height="90" fill="#d4b0c5" opacity="0.45" stroke="#9b738f"/>
  <rect x="1000" y="230" width="14" height="201" fill="#c73f4f"/>
  <text class="small" x="1134" y="427">中心盘</text><text class="small" x="1134" y="408">转盘轴承</text>
  <text class="small" x="1134" y="393">转运板 P03B</text><text class="small" x="1134" y="379">导轨</text>
  <text class="small" x="1134" y="352">中央托盘</text><text class="small" x="1134" y="302">模型车外包络</text>
  <path d="M1030 230 h15 M1038 230 v111 M1030 341 h15" stroke="#b12b3a" stroke-width="2" fill="none"/>
  <text class="red small" x="1055" y="253">轴端高出托盘</text>
  <text class="red label" x="1055" y="276">上表面 37 mm</text>
  <text class="small" x="760" y="562">图中电机和轴左右错开以便阅读；实际按同一中心线布置。</text>
  <text class="label red" x="760" y="612">轴穿过未开中心孔的转运板、导轨和托盘。</text>
  <text class="small" x="760" y="645">车仅以外包络表示；转盘、法兰和支撑座需按实物复核。</text>
  <text class="small" x="760" y="671">重新设计轴端位置、连接方式与避让后，再复查运动过程。</text>
</svg>
